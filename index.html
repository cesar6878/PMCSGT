<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMCS Radio y Televisión</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#080a12;--card:#121525;--accent:#ff003c;--accent2:#ffae00;--text:#fff;--muted:#8b8fa3}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw}
.pantalla{position:absolute;inset:0;width:100vw;height:100vh;display:none;flex-direction:column;overflow-y:auto}
.pantalla.active{display:flex}
#radioScreen{background:radial-gradient(ellipse at top,#1a1e35 0%,#080a12 70%);}
.header-radio{padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo-text{font-weight:900;letter-spacing:2px;font-size:14px}
.logo-text span{color:var(--accent)}
.live-badge{background:var(--accent);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.player-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:22px}
.logo-container{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
.logo-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed #ffffff22}
.logo-ring.anim{animation:spin 8s linear infinite}
.logo-img{width:220px;height:220px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#1e253d,#121525);border:4px solid #ffffff15;box-shadow:0 0 60px rgba(255,0,60,.25)}
.logo-img.rotating{animation:spin 6s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.info-radio{text-align:center}
.info-radio h2{font-size:26px;font-weight:900}
.info-radio p{color:var(--muted);font-size:14px;margin-top:6px}
.controls{display:flex;align-items:center;gap:18px}
.btn-play{width:82px;height:82px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-size:32px;cursor:pointer;box-shadow:0 10px 30px rgba(255,0,60,.4)}
.vol{width:120px;accent-color:var(--accent2)}
.btn-tv{margin-top:8px;width:90%;max-width:360px;padding:16px;background:#fff;color:#000;border:none;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
#tvScreen{background:#05070f}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain}
.tv-info{padding:18px;display:flex;flex-direction:column;gap:14px}
.tv-info h2{font-size:20px}
.tv-info h2 span{color:var(--accent2)}
.programa{background:var(--card);border:1px solid #ffffff12;padding:14px;border-radius:12px}
.btns-tv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-sec{padding:14px;border-radius:12px;border:1px solid #ffffff18;background:var(--card);color:#fff;font-weight:800;cursor:pointer}
.btn-sec.primary{background:#fff;color:#000}
.fuera-tv-rect{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.88);z-index:10;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.fuera-tv-rect.show{display:flex}
.fuera-tv-rect .box{background:#151a30;border:2px solid var(--accent);border-radius:18px;padding:32px 26px;width:92%;max-width:380px;text-align:center}
</style>
</head>
<body>

<script>
const CONFIG = {
  RADIO_URL: "https://sh1.radioonlinehd.com:8029/stream",
  TV_URL: "https://tvstream.alojawebgt.net:3434/live/buzzertvlive.m3u8/",
  LOGO_URL: "logo.png",
  NOMBRE_CANAL: "PMCS Radio y Televisión",
  SLOGAN: "Radio en Vivo y Televisión en Vivo 24/7",
  FACEBOOK: "https://facebook.com/",
  YOUTUBE: "https://youtube.com/",
  WHATSAPP: "https://wa.me/50200000000",
  TIKTOK: "https://tiktok.com/"
};
</script>

<div id="radioScreen" class="pantalla active">
  <div class="header-radio">
    <div class="logo-text"><span>PMCS</span> RADIO Y TELEVISIÓN</div>
    <div class="live-badge">EN VIVO</div>
  </div>
  <div class="player-area">
    <div class="logo-container">
      <div class="logo-ring" id="ring"></div>
      <img id="logoRadio" class="logo-img" src="logo.png" alt="logo">
    </div>
    <div class="info-radio">
      <h2>PMCS Radio y Televisión</h2>
      <p>Radio en Vivo</p>
      <p id="estadoRadio" style="margin-top:4px;color:var(--accent2);font-size:12px;font-weight:800">Presiona PLAY</p>
    </div>
    <div class="controls">
      <input type="range" id="volRadio" class="vol" min="0" max="1" step="0.01" value="0.9">
      <button class="btn-play" id="btnPlayRadio"><i class="fa-solid fa-play" id="iconPlay"></i></button>
    </div>
    <button class="btn-tv" onclick="irTV()"><i class="fa-solid fa-tv"></i> VER TELEVISIÓN EN VIVO</button>
  </div>
</div>

<div id="tvScreen" class="pantalla">
  <div class="header-radio">
    <div class="logo-text">PMCS - TELEVISIÓN EN VIVO</div>
    <div class="live-badge"><i class="fa-solid fa-tv"></i> TV</div>
  </div>
  <div class="video-wrap">
    <video id="videoTV" controls playsinline></video>
    <div class="fuera-tv-rect" id="fueraTV"><div class="box"><h3>FUERA DE HORARIO</h3><p>Transmisión finalizada</p></div></div>
  </div>
  <div class="tv-info">
    <h2>Estás viendo <span>PMCS</span> Televisión en Vivo</h2>
    <div class="btns-tv">
      <button class="btn-sec primary" onclick="irRadio()"><i class="fa-solid fa-radio"></i> RADIO EN VIVO</button>
      <button class="btn-sec" onclick="irRadio()"><i class="fa-solid fa-house"></i> INICIO</button>
    </div>
  </div>
</div>

<audio id="audioRadio" preload="none"></audio>
<script>
const audio=document.getElementById('audioRadio');
const video=document.getElementById('videoTV');
const btnPlay=document.getElementById('btnPlayRadio');
const iconPlay=document.getElementById('iconPlay');
const logo=document.getElementById('logoRadio');
const ring=document.getElementById('ring');
const estado=document.getElementById('estadoRadio');
let isPlaying=false;
audio.src=CONFIG.RADIO_URL;
btnPlay.onclick=async()=>{
 try{
  if(!isPlaying){await audio.play();isPlaying=true;iconPlay.className="fa-solid fa-stop";logo.classList.add('rotating');ring.classList.add('anim');estado.textContent="Radio en Vivo - Sonando";}
  else{audio.pause();isPlaying=false;iconPlay.className="fa-solid fa-play";logo.classList.remove('rotating');ring.classList.remove('anim');estado.textContent="Pausado";}
 }catch(e){alert("Toca de nuevo");}
};
document.getElementById('volRadio').oninput=e=>{audio.volume=e.target.value};
let hls; if(Hls.isSupported()){hls=new Hls();hls.loadSource(CONFIG.TV_URL);hls.attachMedia(video);}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=CONFIG.TV_URL;}
function irTV(){document.getElementById('radioScreen').classList.remove('active');document.getElementById('tvScreen').classList.add('active');audio.pause();video.play().catch(()=>{});}
function irRadio(){document.getElementById('tvScreen').classList.remove('active');document.getElementById('radioScreen').classList.add('active');video.pause();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
